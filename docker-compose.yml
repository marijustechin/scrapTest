# Local development stack. Values can be overridden via a root .env file.
services:
  postgres:
    image: postgres:17-alpine
    container_name: scraptest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraptest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraptest}
      POSTGRES_DB: ${POSTGRES_DB:-scraptest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scraptest} -d ${POSTGRES_DB:-scraptest}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
